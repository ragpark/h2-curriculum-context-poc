# Evidence is teacher-marked work: a task, the topics it covered, a mark (0–1) and, where the teacher saw one, a misconception.
scenarios:
  - id: retells-plot
    title: "Knows the play well, but retells instead of analysing"
    pupil: pupil:priya
    story: "Strong on quotations and context facts, but her paragraphs explain what happens rather than how Shakespeare presents it, and name techniques without their effect."
    events:
      - {source: "Class quiz", activity: "Quotation retrieval quiz: Acts 1–2", concepts: [sk-quotation, ch-macbeth], score: 0.9}
      - {source: "Class quiz", activity: "Context quiz: James I, the Gunpowder Plot and witchcraft", concepts: [ctx-james, ctx-gunpowder, ctx-witchcraft], score: 0.85}
      - {source: "Teacher marking", activity: "Paragraph: How does Shakespeare present Macbeth's ambition in 'Stars, hide your fires'?", concepts: [th-ambition, ch-macbeth, sk-language], score: 0.35, misconception: mc:english/retelling}
      - {source: "Teacher marking", activity: "Paragraph: blood imagery in Act 2 Scene 2", concepts: [lf-blood, th-guilt, sk-language], score: 0.4, misconception: mc:english/feature-spotting}
      - {source: "Teacher marking", activity: "Paragraph: Lady Macbeth in Act 1 Scene 5", concepts: [ch-lady, sk-language], score: 0.4, misconception: mc:english/retelling}
  - id: bolts-on-context
    title: "Good analysis, but context bolted on and characters as real people"
    pupil: pupil:tom
    story: "Analyses words well, but adds context as a separate fact and writes about what characters 'should have done' as if they were real."
    events:
      - {source: "Class quiz", activity: "Quotation retrieval quiz: Acts 1–2", concepts: [sk-quotation], score: 0.7}
      - {source: "Teacher marking", activity: "Paragraph: Macbeth's guilt after the murder", concepts: [th-guilt, lf-blood, sk-language], score: 0.75}
      - {source: "Teacher marking", activity: "Paragraph: the witches in Act 1 Scene 3", concepts: [ch-witches, th-supernatural, sk-context], score: 0.45, misconception: mc:english/bolt-on-context}
      - {source: "Teacher marking", activity: "Paragraph: Is Macbeth to blame for Duncan's murder?", concepts: [th-fate, ch-macbeth, sk-argument], score: 0.4, misconception: mc:english/real-people}
      - {source: "Teacher marking", activity: "Paragraph: Lady Macbeth and Jacobean ideas about women", concepts: [ch-lady, ctx-gender, sk-context], score: 0.4, misconception: mc:english/bolt-on-context}
  - id: single-reading
    title: "Sees Lady Macbeth as simply evil; stays in the extract"
    pupil: pupil:zainab
    story: "Knows her quotations and writes tidy PETAL paragraphs, but reads Lady Macbeth only as a villain and does not move beyond the extract."
    events:
      - {source: "Class quiz", activity: "Quotation retrieval quiz: Acts 1–2", concepts: [sk-quotation], score: 0.95}
      - {source: "Teacher marking", activity: "PETAL paragraph: Lady Macbeth in Act 1 Scene 5", concepts: [ch-lady, sk-language], score: 0.6, misconception: mc:english/single-reading}
      - {source: "Teacher marking", activity: "PETAL paragraph: 'Macbeth does murder sleep'", concepts: [lf-sleep, th-guilt, sk-language], score: 0.75}
      - {source: "Teacher marking", activity: "Paragraph: how is Lady Macbeth presented as powerful?", concepts: [ch-lady, th-ambition], score: 0.5, misconception: mc:english/single-reading}
      - {source: "Teacher marking", activity: "Extract essay: Lady Macbeth in Act 1 Scene 5 and in the play as a whole", concepts: [sk-extract-whole, ch-lady], score: 0.45, misconception: mc:english/extract-only}
  - id: long-quotes
    title: "Strong arguments, but long quotations and technique-spotting"
    pupil: pupil:leah
    story: "Plans a clear line of argument, but copies out whole lines as evidence and names techniques without saying what they do."
    events:
      - {source: "Teacher marking", activity: "Essay plan: How far is Macbeth responsible for his downfall?", concepts: [sk-argument, th-fate], score: 0.8}
      - {source: "Class quiz", activity: "Context quiz: James I, the Gunpowder Plot and witchcraft", concepts: [ctx-james, ctx-gunpowder, ctx-witchcraft], score: 0.8}
      - {source: "Teacher marking", activity: "Paragraph: Lady Macbeth in Act 1 Scene 5", concepts: [ch-lady, sk-quotation], score: 0.4, misconception: mc:english/long-quotes}
      - {source: "Teacher marking", activity: "Paragraph: the witches' language in Act 1 Scene 1", concepts: [ch-witches, lf-verse, sk-language], score: 0.45, misconception: mc:english/feature-spotting}
      - {source: "Teacher marking", activity: "Paragraph: blood imagery after the murder", concepts: [lf-blood, th-guilt, sk-quotation], score: 0.45, misconception: mc:english/long-quotes}
  - id: modern-values
    title: "Tidy PETAL paragraphs, but judges the play by modern values"
    pupil: pupil:owen
    story: "Writes well-structured PETAL paragraphs with good word analysis, but calls Jacobean attitudes 'sexist' or 'stupid' instead of asking how the original audience would respond."
    events:
      - {source: "Teacher marking", activity: "PETAL paragraph: 'Macbeth does murder sleep'", concepts: [lf-sleep, th-guilt, sk-language], score: 0.8}
      - {source: "Class quiz", activity: "Quotation retrieval quiz: Acts 1–2", concepts: [sk-quotation], score: 0.75}
      - {source: "Teacher marking", activity: "PETAL paragraph: Lady Macbeth and Jacobean ideas about women", concepts: [ch-lady, ctx-gender, sk-context], score: 0.4, misconception: mc:english/presentism}
      - {source: "Teacher marking", activity: "PETAL paragraph: why Duncan's murder shocks the audience", concepts: [ctx-gunpowder, th-kingship, sk-context], score: 0.45, misconception: mc:english/presentism}
