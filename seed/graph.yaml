    teaches: [cc:maths/alg/lin-eq-one-step, cc:maths/alg/lin-eq-two-step, cc:maths/alg/lin-eq-both-sides, cc:maths/alg/lin-eq-brackets, cc:maths/alg/lin-eq-fractions, cc:maths/alg/lin-inequalities, cc:maths/alg/rearrange-formulae]
    keywords: [balance, balanced, scales, "same to both sides", "keep it balanced", "do the same", "balance method"]
  - id: md:maths/alg/change-side-change-sign
