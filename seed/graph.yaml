misconceptions:
  - id: mc:maths/alg/sign-transfer
    label: Sign error when moving a term across the equals sign
    description: Moves a term to the other side without changing the operation (e.g. 5x + 3 = 2x + 12 → 7x = 15).
    affects: [cc:maths/alg/lin-eq-both-sides, cc:maths/alg/lin-eq-brackets, cc:maths/alg/rearrange-formulae, cc:maths/alg/lin-inequalities]
    keywords: ["sign error", "moving a term", "wrong sign", "across the equals sign", "why the sign changes"]
  - id: mc:maths/alg/inverse-order
    label: Undoes operations in the wrong order
    description: Divides before subtracting when solving 2x + 3 = 11, giving x = 11/2 − 3.
    affects: [cc:maths/alg/lin-eq-two-step, cc:maths/alg/rearrange-formulae]
    keywords: ["wrong order", "reverse order", "last thing that was done first", "undo the last"]
  - id: mc:maths/alg/partial-expansion
    label: Multiplies only the first term inside a bracket
    description: Writes 3(x + 2) as 3x + 2.
    affects: [cc:maths/alg/expand-single, cc:maths/alg/lin-eq-brackets]
    keywords: ["every term", "each term inside", "both terms", "only the first term", "3x + 2"]
  - id: mc:maths/num/neg-times-neg
    label: Believes a negative multiplied by a negative is negative
    description: Writes −2 × −3 = −6, so −2(x − 3) becomes −2x − 6.
    affects: [cc:maths/num/directed-numbers, cc:maths/alg/expand-single]
    keywords: ["negative times a negative", "two negatives", "-2(x - 3)", "minus times minus"]
  - id: mc:maths/alg/inequality-flip
    label: Does not reverse the inequality when multiplying or dividing by a negative
    description: Solves −2x < 6 as x < −3.
    affects: [cc:maths/alg/lin-inequalities]
    keywords: ["reverse the inequality", "flip the sign", "dividing by a negative"]
  - id: mc:maths/alg/letter-as-object
    label: Treats letters as objects or labels rather than numbers
    description: Reads 3a as "three apples".
    affects: [cc:maths/alg/notation, cc:maths/alg/form-equations]
    keywords: ["apples", "fruit salad", "stands for a number", "not an object"]
  - id: mc:maths/alg/equals-as-answer
    label: Reads "=" as "the answer is" rather than equivalence
    description: Struggles to accept an expression on the right-hand side of an equation.
    affects: [cc:maths/alg/lin-eq-one-step, cc:maths/alg/lin-eq-both-sides]
    keywords: ["equals means", "equivalence", "balance means equal", "both sides are equal"]
  - id: mc:maths/alg/fraction-partial
    label: Multiplies only one term by the denominator
    description: From x/3 + 2 = 5 writes x + 2 = 15.
    affects: [cc:maths/alg/lin-eq-fractions]
    keywords: ["every term by the denominator", "clear the fraction", "only one term by the denominator"]

methods:
