misconceptions:
  - id: mc:english/retelling
    label: Retells the plot instead of analysing
    description: "Explains what happens (\"then Macbeth kills Duncan\") rather than how and why Shakespeare presents it."
    affects: [sk-language, sk-argument]
    keywords: ["retell", "retelling", "what happens", "narrative", "tells the story"]
  - id: mc:english/feature-spotting
    label: Names a technique without explaining its effect
    description: "Writes \"Shakespeare uses imagery\" and stops, without saying what the image suggests or does."
    affects: [sk-language, sk-terminology]
    keywords: ["feature spotting", "feature-spotting", "just name", "without explaining", "so what"]
  - id: mc:english/bolt-on-context
    label: Bolts on context that does not support the argument
    description: "Adds a context fact (\"James I believed in witches\") in a separate sentence that is not linked to the point being made."
    affects: [sk-context]
    keywords: ["bolt on", "bolted on", "bolt-on", "context dump", "linked to your point"]
  - id: mc:english/real-people
    label: Treats characters as real people rather than Shakespeare's constructions
    description: "Writes about what Macbeth \"should have done\" instead of what Shakespeare uses him to show."
    affects: [sk-argument, sk-language]
    keywords: ["real people", "real person", "should have", "construct", "shakespeare uses"]
  - id: mc:english/witches-control
    label: Believes the witches control Macbeth, so he is not responsible
    description: "Reads the prophecies as fixed commands, missing that Macbeth chooses to act on them."
    affects: [th-fate, ch-witches, ch-macbeth]
    keywords: ["witches made him", "control macbeth", "controlled by the witches", "no choice"]
  - id: mc:english/single-reading
    label: Reads Lady Macbeth as simply evil (one fixed reading)
    description: "Sees Lady Macbeth only as a villain, missing her vulnerability, her dependence on Macbeth and her collapse."
    affects: [ch-lady, sk-alternative]
    keywords: ["simply evil", "just evil", "evil villain", "one reading", "fixed reading"]
  - id: mc:english/long-quotes
    label: Uses long quotations instead of short embedded ones
    description: "Copies out whole lines, leaving no room to analyse individual words."
    affects: [sk-quotation]
    keywords: ["long quotations", "whole lines", "copy out", "too long"]
  - id: mc:english/presentism
    label: Judges the play only by modern values
    description: "Calls Jacobean attitudes \"stupid\" or \"sexist\" without considering how a Jacobean audience would respond."
    affects: [sk-context, ctx-gender]
    keywords: ["modern values", "today we", "nowadays", "modern audience only"]
  - id: mc:english/extract-only
    label: Writes only about the extract, not the whole play
    description: "Answers the extract question well but never moves out to the rest of the play."
    affects: [sk-extract-whole]
    keywords: ["only the extract", "extract only", "rest of the play", "never moves out"]

