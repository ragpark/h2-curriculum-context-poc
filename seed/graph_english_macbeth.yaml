# Curriculum map — GCSE English Literature (KS4): Macbeth. Illustrative seed.
#
# Unlike the maths strand, this is a WEB not a ladder:
#   • Knowledge (context, characters, themes, language & form) is connected by 'relatesTo' links, not prerequisites.
#   • Only the writing skills (mapped to the GCSE assessment objectives) build on each other ('prerequisites').
#   • Key quotations are first-class nodes that 'evidence' characters, themes and methods.
subject: english
graph_version: "2026.1"
title: "English Literature — Macbeth (KS4)"
layout: strands
strands:
  - {id: context, label: Context}
  - {id: characters, label: Characters}
  - {id: themes, label: Themes}
  - {id: language, label: "Language, form & structure"}
  - {id: skills, label: "Writing skills (AOs)"}

