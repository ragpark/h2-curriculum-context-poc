# Preset evidence scenarios. 'item' evidence carries concept IDs (aligned source);
# 'activity' evidence is an untagged markbook entry the aligner must interpret.
scenarios:
  - id: sign-transfer
    title: "Sign-transfer pattern on both-sides equations"
    pupil: pupil:amara
    story: "Secure on inverse operations and two-step equations, but repeatedly moves terms across the equals sign without changing the operation."
    events:
      - {source: "Homework platform", item: item:inv-1, response: "5"}
      - {source: "Homework platform", item: item:inv-2, response: "add 7"}
      - {source: "Homework platform", item: item:one-1, response: "x = 5"}
      - {source: "Homework platform", item: item:two-1, response: "x = 4"}
      - {source: "Homework platform", item: item:two-2, response: "x = 7"}
      - {source: "Homework platform", item: item:clt-1, response: "3x + 7"}
      - {source: "Vendor X tutor", item: item:bs-1, response: "x = 5"}
      - {source: "Vendor X tutor", item: item:bs-2, response: "x = 1.2"}
      - {source: "Vendor X tutor", item: item:bs-1, response: "x = 9/7"}
      - {source: "Vendor X tutor", item: item:bs-3, response: "x = 4"}
      - {source: "Teacher markbook", activity: "Algebra 3 homework — solving equations with x on both sides", score: 0.45}
  - id: brackets-gap
    title: "Secure on equations, gap in expanding brackets"
    pupil: pupil:ben
    story: "Solves equations well but only multiplies the first term in a bracket and struggles with negatives."
    events:
      - {source: "Homework platform", item: item:two-1, response: "x = 4"}
      - {source: "Homework platform", item: item:bs-1, response: "x = 3"}
      - {source: "Homework platform", item: item:bs-2, response: "x = 3"}
      - {source: "Vendor X tutor", item: item:exp-1, response: "3x + 2"}
      - {source: "Vendor X tutor", item: item:exp-2, response: "−2x − 6"}
      - {source: "Vendor X tutor", item: item:dir-1, response: "−6"}
      - {source: "Vendor X tutor", item: item:br-1, response: "x = 19/3"}
  - id: new-starter
    title: "New to the strand"
    pupil: pupil:chloe
    story: "Only a single markbook entry so far — the aligner has to interpret an untagged activity title."
    events:
      - {source: "Teacher markbook", activity: "Starter quiz: inverse operations and one-step equations", score: 0.8}
  - id: forgets-to-change-sign
    title: "Class 10Y: forgets to change the sign"
    pupil: pupil:dev
    story: "Taught 'change side, change sign'. Secure on two-step equations, but on both-sides equations he moves terms without changing their sign."
    events:
      - {source: "Homework platform", item: item:two-1, response: "x = 4"}
      - {source: "Homework platform", item: item:two-2, response: "x = 7"}
      - {source: "Homework platform", item: item:clt-1, response: "3x + 7"}
      - {source: "Vendor X tutor", item: item:bs-1, response: "x = 5"}
      - {source: "Vendor X tutor", item: item:bs-2, response: "x = 1.2"}
      - {source: "Vendor X tutor", item: item:bs-3, response: "x = 4"}
  - id: secure-and-ahead
    title: "Class 10Y: secure and wants more"
    pupil: pupil:farah
    story: "Secure on everything the class has covered so far. Brackets are next in the scheme but have not been taught yet."
    events:
      - {source: "Homework platform", item: item:two-1, response: "x = 4"}
      - {source: "Homework platform", item: item:two-2, response: "x = 7"}
      - {source: "Homework platform", item: item:clt-1, response: "3x + 7"}
      - {source: "Vendor X tutor", item: item:bs-1, response: "x = 3"}
      - {source: "Vendor X tutor", item: item:bs-2, response: "x = 3"}
      - {source: "Vendor X tutor", item: item:bs-3, response: "x = −4"}
      - {source: "Vendor X tutor", item: item:dir-1, response: "6"}
  - id: brackets-gap-twin
    title: "Same answers as Ben, no agreed adjustments"
    pupil: pupil:bilal
    story: "Identical evidence to Ben. He has no adjustments profile. He exists so the effect of Ben's adjustments can be measured on its own."
    events:
      - {source: "Homework platform", item: item:two-1, response: "x = 4"}
      - {source: "Homework platform", item: item:bs-1, response: "x = 3"}
      - {source: "Homework platform", item: item:bs-2, response: "x = 3"}
      - {source: "Vendor X tutor", item: item:exp-1, response: "3x + 2"}
      - {source: "Vendor X tutor", item: item:exp-2, response: "−2x − 6"}
      - {source: "Vendor X tutor", item: item:dir-1, response: "−6"}
      - {source: "Vendor X tutor", item: item:br-1, response: "x = 19/3"}
  - id: secure-and-ahead-twin
    title: "Same answers as Farah, no agreed adjustments"
    pupil: pupil:fatima
    story: "Identical evidence to Farah. She has no adjustments profile, so the class scope rule applies to her in full."
    events:
      - {source: "Homework platform", item: item:two-1, response: "x = 4"}
      - {source: "Homework platform", item: item:two-2, response: "x = 7"}
      - {source: "Homework platform", item: item:clt-1, response: "3x + 7"}
      - {source: "Vendor X tutor", item: item:bs-1, response: "x = 3"}
      - {source: "Vendor X tutor", item: item:bs-2, response: "x = 3"}
      - {source: "Vendor X tutor", item: item:bs-3, response: "x = −4"}
      - {source: "Vendor X tutor", item: item:dir-1, response: "6"}
  - id: wrong-order
    title: "Class 10X: undoes operations in the wrong order"
    pupil: pupil:gabriel
    story: "Secure on one-step equations, but on two-step equations he divides before dealing with the added or subtracted number."
    events:
      - {source: "Homework platform", item: item:one-1, response: "x = 5"}
      - {source: "Homework platform", item: item:inv-2, response: "add 7"}
      - {source: "Homework platform", item: item:clt-1, response: "3x + 7"}
      - {source: "Vendor X tutor", item: item:inv-1, response: "6.5"}
      - {source: "Vendor X tutor", item: item:two-1, response: "x = 2.5"}
      - {source: "Vendor X tutor", item: item:two-1, response: "x = 2.5"}
  - id: equals-as-answer
    title: "Class 10Y: reads = as 'the answer is'"
    pupil: pupil:hana
    story: "Can solve simple equations, but reads the equals sign as 'the answer is', which trips her up when x appears on both sides."
    events:
      - {source: "Homework platform", item: item:one-1, response: "x = 5"}
      - {source: "Homework platform", item: item:two-1, response: "x = 4"}
      - {source: "Vendor X tutor", item: item:bs-4, response: "No — the answer should be 7"}
      - {source: "Vendor X tutor", item: item:bs-1, response: "x = 3"}
      - {source: "Vendor X tutor", item: item:bs-4, response: "No — the answer should be 7"}
  # ---- Same answers, different learning behaviour. 'process' = events a tool observed during each answer (t = seconds).
  - id: gives-up-quickly
    title: "Asks for help before trying, stops after an error"
    pupil: pupil:isla
    story: "Same answers as Jay. Asks for hints before trying, even on topics she knows, stops after one error, and underestimates herself when she is right."
    events:
      - {source: "Vendor X tutor", item: item:two-1, response: "x = 4", process: [{type: hint_requested, t: 3}, {type: attempt, t: 40, answer: "x = 4", correct: true}, {type: confidence, t: 42, rating: 1}]}
      - {source: "Vendor X tutor", item: item:two-2, response: "x = 7", process: [{type: hint_requested, t: 4}, {type: hint_requested, t: 12}, {type: hint_requested, t: 20}, {type: attempt, t: 55, answer: "x = 7", correct: true}]}
      - {source: "Vendor X tutor", item: item:clt-1, response: "3x + 7", process: [{type: attempt, t: 30, answer: "3x + 7", correct: true}, {type: confidence, t: 32, rating: 1}]}
      - {source: "Vendor X tutor", item: item:bs-1, response: "x = 5", process: [{type: attempt, t: 50, answer: "x = 5", correct: false}, {type: abandoned, t: 58}]}
      - {source: "Vendor X tutor", item: item:bs-2, response: "x = 1.2", process: [{type: hint_requested, t: 2}, {type: attempt, t: 45, answer: "x = 1.2", correct: false}, {type: abandoned, t: 50}]}
      - {source: "Vendor X tutor", item: item:bs-3, response: "x = 4", process: [{type: attempt, t: 60, answer: "x = 4", correct: false}, {type: affect, t: 62, signal: "frustration"}, {type: abandoned, t: 65}]}
  - id: repeats-same-method
    title: "Keeps going but repeats the same method"
    pupil: pupil:jay
    story: "Same answers as Isla. Never asks for help and keeps trying, but repeats the same wrong method, and is very sure of answers that are wrong."
    events:
      - {source: "Vendor X tutor", item: item:two-1, response: "x = 4", process: [{type: attempt, t: 25, answer: "x = 4", correct: true}, {type: confidence, t: 27, rating: 4}]}
      - {source: "Vendor X tutor", item: item:two-2, response: "x = 7", process: [{type: attempt, t: 30, answer: "x = 7", correct: true}, {type: confidence, t: 31, rating: 4}]}
      - {source: "Vendor X tutor", item: item:clt-1, response: "3x + 7", process: [{type: attempt, t: 20, answer: "3x + 7", correct: true}, {type: confidence, t: 21, rating: 4}]}
      - {source: "Vendor X tutor", item: item:bs-1, response: "x = 5", process: [{type: attempt, t: 35, answer: "x = 5", correct: false}, {type: attempt, t: 70, answer: "x = 5", correct: false}, {type: attempt, t: 110, answer: "x = 5", correct: false}, {type: confidence, t: 112, rating: 4}]}
      - {source: "Vendor X tutor", item: item:bs-2, response: "x = 1.2", process: [{type: attempt, t: 40, answer: "x = 1.2", correct: false}, {type: attempt, t: 80, answer: "x = 1.2", correct: false}, {type: confidence, t: 82, rating: 4}]}
      - {source: "Vendor X tutor", item: item:bs-3, response: "x = 4", process: [{type: attempt, t: 45, answer: "x = 4", correct: false}, {type: attempt, t: 90, answer: "x = 4", correct: false}, {type: confidence, t: 92, rating: 4}]}
