# Preset evidence scenarios. 'item' evidence carries concept IDs (aligned source);
# 'activity' evidence is an untagged markbook entry the aligner must interpret.
scenarios:
  - id: sign-transfer
    title: "Sign-transfer pattern on both-sides equations"
    pupil: pupil:amara
    story: "Secure on inverse operations and two-step equations, but repeatedly moves terms across the equals sign without changing the operation."
    events:
      - {source: "Homework platform", item: item:inv-1, response: "5"}
      - {source: "Homework platform", item: item:inv-2, response: "add 7"}
      - {source: "Homework platform", item: item:one-1, response: "x = 5"}
      - {source: "Homework platform", item: item:two-1, response: "x = 4"}
      - {source: "Homework platform", item: item:two-2, response: "x = 7"}
      - {source: "Homework platform", item: item:clt-1, response: "3x + 7"}
      - {source: "Vendor X tutor", item: item:bs-1, response: "x = 5"}
      - {source: "Vendor X tutor", item: item:bs-2, response: "x = 1.2"}
      - {source: "Vendor X tutor", item: item:bs-1, response: "x = 9/7"}
      - {source: "Vendor X tutor", item: item:bs-3, response: "x = 4"}
      - {source: "Teacher markbook", activity: "Algebra 3 homework — solving equations with x on both sides", score: 0.45}
  - id: brackets-gap
    title: "Secure on equations, gap in expanding brackets"
    pupil: pupil:ben
    story: "Solves equations well but only multiplies the first term in a bracket and struggles with negatives."
    events:
      - {source: "Homework platform", item: item:two-1, response: "x = 4"}
      - {source: "Homework platform", item: item:bs-1, response: "x = 3"}
      - {source: "Homework platform", item: item:bs-2, response: "x = 3"}
      - {source: "Vendor X tutor", item: item:exp-1, response: "3x + 2"}
      - {source: "Vendor X tutor", item: item:exp-2, response: "−2x − 6"}
      - {source: "Vendor X tutor", item: item:dir-1, response: "−6"}
      - {source: "Vendor X tutor", item: item:br-1, response: "x = 19/3"}
  - id: new-starter
    title: "New to the strand"
    pupil: pupil:chloe
    story: "Only a single markbook entry so far — the aligner has to interpret an untagged activity title."
    events:
      - {source: "Teacher markbook", activity: "Starter quiz: inverse operations and one-step equations", score: 0.8}
  - id: forgets-to-change-sign
    title: "Class 10Y: forgets to change the sign"
    pupil: pupil:dev
    story: "Taught 'change side, change sign'. Secure on two-step equations, but on both-sides equations he moves terms without changing their sign."
    events:
      - {source: "Homework platform", item: item:two-1, response: "x = 4"}
      - {source: "Homework platform", item: item:two-2, response: "x = 7"}
      - {source: "Homework platform", item: item:clt-1, response: "3x + 7"}
      - {source: "Vendor X tutor", item: item:bs-1, response: "x = 5"}
      - {source: "Vendor X tutor", item: item:bs-2, response: "x = 1.2"}
      - {source: "Vendor X tutor", item: item:bs-3, response: "x = 4"}
  - id: secure-and-ahead
    title: "Class 10Y: secure and wants more"
    pupil: pupil:farah
    story: "Secure on everything the class has covered so far. Brackets are next in the scheme but have not been taught yet."
    events:
      - {source: "Homework platform", item: item:two-1, response: "x = 4"}
      - {source: "Homework platform", item: item:two-2, response: "x = 7"}
      - {source: "Homework platform", item: item:clt-1, response: "3x + 7"}
      - {source: "Vendor X tutor", item: item:bs-1, response: "x = 3"}
      - {source: "Vendor X tutor", item: item:bs-2, response: "x = 3"}
      - {source: "Vendor X tutor", item: item:bs-3, response: "x = −4"}
      - {source: "Vendor X tutor", item: item:dir-1, response: "6"}
